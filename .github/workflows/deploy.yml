name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: |
          node -e '
            const endpoint = URL.parse(process.env.PUBLIC_INQUIRY_ENDPOINT ?? "");
            if (!endpoint || endpoint.protocol !== "https:" || endpoint.username ||
                endpoint.password || endpoint.search || endpoint.hash) {
              console.error("Set PUBLIC_INQUIRY_ENDPOINT to the public HTTPS inquiry URL without credentials, a query, or a fragment.");
              process.exit(1);
            }
          '
          npm run build
        env:
          PUBLIC_INQUIRY_ENDPOINT: ${{ vars.PUBLIC_INQUIRY_ENDPOINT }}

      - name: Install layout test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Check responsive layouts
        run: npx playwright test

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
